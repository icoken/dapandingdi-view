<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看大盘温度与六项因子评分的历史走势。">
  <title>大盘顶底 · 六因子温度</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./series.js"></script>
  <script defer src="./dashboard.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="masthead">
      <div>
        <h1>大盘顶底</h1>
        <p class="subtitle">六因子市场温度</p>
      </div>
      <div class="latest">
        <p>最新温度 <time id="latest-date"></time></p>
        <div class="latest-reading">
          <strong id="latest-score">—</strong>
          <span class="scale">/ 100</span>
          <span id="latest-zone" class="zone"></span>
        </div>
      </div>
    </header>

    <noscript><p class="notice">请启用 JavaScript 查看历史图表。</p></noscript>
    <p class="notice" id="data-error" hidden>温度数据加载失败。</p>

    <section class="panel" aria-labelledby="history-title">
      <div class="panel-header">
        <div>
          <h2 id="history-title">温度历史</h2>
          <p class="date-range" id="visible-range"></p>
        </div>
        <div class="periods" id="periods" role="group" aria-label="图表时间范围">
          <button type="button" data-length="60" aria-pressed="false">近 60 日</button>
          <button type="button" data-length="250" aria-pressed="true">近 250 日</button>
          <button type="button" data-length="all" aria-pressed="false">全部</button>
        </div>
      </div>
      <div class="plot">
        <canvas id="temperature-chart" tabindex="0" role="img" aria-label="历史温度线图，左右方向键查看交易日">
          历史温度线图。
        </canvas>
        <output id="temperature-tip" class="tooltip" hidden></output>
      </div>
      <ul class="thresholds" aria-label="温度参考线">
        <li><span class="reference cold" aria-hidden="true"></span>20 底部参考</li>
        <li><span class="reference hot" aria-hidden="true"></span>80 顶部参考</li>
      </ul>
    </section>

    <section class="panel" aria-labelledby="factors-title">
      <div class="panel-header">
        <div>
          <h2 id="factors-title">六因子历史</h2>
          <p class="date-range">各项评分范围为 0–100</p>
        </div>
      </div>
      <div id="factors" class="factors" role="group" aria-label="选择查看的因子"></div>
      <div class="plot plot-factors">
        <canvas id="factor-chart" tabindex="0" role="img" aria-label="因子历史线图，左右方向键查看交易日">
          因子历史线图。
        </canvas>
        <output id="factor-tip" class="tooltip" hidden></output>
      </div>
    </section>

    <footer class="footer">
      <span id="all-dates"></span>
      <a href="https://www.55188.com/thread-41156578-1-1.html" rel="noopener noreferrer">原版方法 · 理想论坛</a>
    </footer>
  </main>
</body>
</html>
